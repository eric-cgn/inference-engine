volumes:
  zmq_ipc:   # ZMQ socket shared between Frigate and the inference engine

services:
  frigate-inference:
    container_name: frigate-inference
    image: ${INFERENCE_IMAGE:-frigate-inference:sm_61}
    restart: unless-stopped
    volumes:
      - zmq_ipc:/run/zmq
      - ${FRIGATE_MODELS_DIR:-/opt/frigate/models}:/models
      - ${FRIGATE_CONFIG_DIR:-/opt/frigate/config}:/config:ro
    deploy:
      resources:
        reservations:
          devices:
            # Pinned via CDI so GPU access survives `systemctl daemon-reload`
            # (the legacy --gpus/nvidia-runtime path can lose the device cgroup
            # and silently drop the GPU until the container is recreated).
            # install.sh sets INFERENCE_CDI_DEVICE in .env from `nvidia-ctk cdi list`.
            - driver: cdi
              device_ids:
                - ${INFERENCE_CDI_DEVICE:-nvidia.com/gpu=0}
              capabilities: [gpu]
