# Frigate configuration snippet — add this to your frigate config.yml
#
# Each detector entry is a single-threaded ZMQ REQ pipe. Adding more entries lets
# Frigate send frames concurrently rather than waiting for each round-trip to complete.
# All pipes hit the same ROUTER socket; the engine batches them together and fans the
# results back. Use at least one entry per GPU. Adding more may improve throughput by
# keeping the GPU better fed, or may make no difference — it depends on camera count,
# frame rate, batch size, and GPU speed.

detectors:
  zmq0:
    type: zmq
    endpoint: ipc:///run/zmq/detector.sock
  # zmq1:
  #   type: zmq
  #   endpoint: ipc:///run/zmq/detector.sock

model:
  path: yolo26n.engine        # TRT-compiled engine (run tools/optimize.py first)
  # path: yolo26n             # .pt fallback if you haven't compiled yet
  # path: your-frigate-plus-model  # Frigate+ transfers the model automatically over ZMQ on first run
  labelmap_path: /config/coco.labels
  model_type: yolo-generic

  # Wire format. Both settings matter, and Frigate's defaults (nchw / float) are
  # the slowest combination -- set them explicitly.
  #
  # `int` ships the raw uint8 frame (1.23 MB at 640x640x3) and lets the ÷255
  # happen on the GPU. `float` makes Frigate convert to float32 and divide on the
  # CPU first, putting 4.92 MB on the socket for the same pixels. Measured with
  # Frigate out of the loop, 4 concurrent clients:
  #
  #                      int + nhwc      float + nchw
  #   RTX 2060 (TRT 11)  23.0 ms         27.6 ms      (+17%)
  #   GTX 1050 Ti        38.4 ms         48.6 ms      (+26%)
  #
  # At a single client the gap is wider still: +25% on the 2060, +42% on the 1050.
  #
  # Frigate+ models are the exception: their metadata carries inputShape and
  # inputDataType, and Frigate applies those *after* this file, so setting them
  # here has no effect. Verified against a plus:// model -- neither this block
  # nor a per-detector model: override changed the resolved config. Those models
  # use whatever wire format they were published with (commonly nchw + float),
  # and the engine's float32 NCHW fast path is what accelerates that case.
  input_tensor: nhwc
  input_dtype: int
  input_pixel_format: rgb
  width: 640
  height: 640
